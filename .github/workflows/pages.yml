name: Pages

# Builds the game for the browser and serves it with its circuit.
#
# The page and both builds of the viewer are built here. The circuit is not: baking it needs the
# car's model, which Blender makes, and takes a PC a minute or two. It is baked there and
# published as a release of this repository (scripts/publish-circuit.py). scene.txt names the
# release and the file's SHA-256, and this downloads it and checks it, so the site always holds
# exactly what was published. It is served from the same site as the page, so that the browser
# can stream it, which it cannot from a release.

on:
  push:
    branches: [main]
    # The site uses none of the documentation, so changes to it alone don't redeploy.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build the site
        run: bash scripts/build-web.sh
      - name: Download and check the circuit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r name release digest < <(grep -v '^#' scene.txt | grep .)
          # A release is OWNER/REPO@TAG, or a tag of this repository.
          if [[ "$release" == *@* ]]; then repo=${release%@*}; tag=${release#*@}; else repo=${{ github.repository }}; tag=$release; fi
          gh release download "$tag" --repo "$repo" --pattern "$name" --dir dist/assets
          echo "$digest  dist/assets/$name" | sha256sum --check
          ls -l dist dist/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The circuit is a couple of hundred megabytes, which takes Pages a while to take in.
          timeout: 1800000
